<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Metal Fracture Classifier</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #eef2f3, #ffffff);
      min-height: 100vh;
      padding: 40px;
      color: #333;
    }

    .main-layout {
      max-width: 1400px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: flex-start;
    }

    .left,
    .right {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .upload-box,
    #canvas,
    .processed-container,
    #analysisBox {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      text-align: justify;
      background-color: #fff;
    }

    .upload-box input[type="file"] {
      display: none;
    }

    .upload-btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .upload-btn:hover {
      background: linear-gradient(135deg, #5a4ccf, #8e84ff);
    }

    #canvas {
      margin-top: 20px;
    }

    .processed-container {
      margin-top: 20px;
    }

    #processedImg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 12px;
    }

    p {
      text-align: center;
      color: #636e72;
      margin-bottom: 20px;
      font-size: 16px;
    }

    #result {
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
    }

    #result .bar-wrapper {
      background: #e0e0e0;
      border-radius: 12px;
      height: 32px;
      margin: 12px 0;
      overflow: hidden;
    }

    #result .bar {
      height: 100%;
      text-align: right;
      padding-right: 14px;
      line-height: 32px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      border-radius: 12px;
    }

    #analysisBox {
      margin-top: 20px;
      font-size: 15px;
      line-height: 1.6;
      color: #2d3436;
    }

    .logo {
      position: absolute;
      top: 40px;
      left: 40px;
      height: 60px;
    }

    footer {
      text-align: center;
      font-size: 12px;
      margin-top: 50px;
      color: #999;
    }
  </style>
</head>
<body>
  <img class="logo" src="https://i.ibb.co.com/JRvPmhmM/LOGO-AFS-HIGH-trans.png" alt="Company Logo">
  <h2>Metal Fracture Classifier</h2>
  <p>Upload an image to classify metal fractures</p>
  <div class="main-layout">
    <div class="left">
      <div class="upload-title">📤 Upload or Drag your photo here</div>
      <div class="upload-box">
        <label for="imageInput" class="upload-btn">📁 Upload Image</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>
    
      <div class="canvas-title">🖼 Uploaded Image</div>
      <canvas id="canvas" width="400" height="400"></canvas>
    
      <div class="processed-title">🎯 Edge Detection Image</div>
      <div class="processed-container">
        <img id="processedImg" src="" alt="Processed Preview" style="display:none">
        <span id="analyzingText">🧠 Analyzing with OpenAI...</span>
      </div>
    </div>
    
    <div class="right">
      <div id="result"></div>
      <div class="analysis-title">📋 Fracture Analysis</div>
      <div id="analysisBox"></div>
    </div>
    
  </div>
  <div id="loadingMessage" style="display: none; color: #888; font-size: 14px; text-align: center; margin-top: 20px;">
    Loading model...
  </div>
  <footer>Andalan Fluid Sistem © All rights reserved</footer>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <!-- OpenCV.js -->
  <script async src="https://docs.opencv.org/4.5.5/opencv.js" onload="console.log('✅ OpenCV.js is ready')"></script>
  <!-- Your main logic -->
  <script src="script.js"></script>
</body>
</html>
